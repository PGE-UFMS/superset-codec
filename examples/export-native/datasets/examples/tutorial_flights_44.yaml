  type: STRING
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: "CASE origin_municipality\r\n  WHEN 'Aberdeen'        THEN 'GB-ABE'\r\
    \n  WHEN 'Belfast'         THEN 'GB-BFS'\r\n  WHEN 'Birmingham'      THEN 'GB-BIR'\r\
    \n  WHEN 'Blackpool'       THEN 'GB-BPL'\r\n  WHEN 'Bournemouth'     THEN 'GB-BMH'\r\
    \n  WHEN 'Bristol'         THEN 'GB-BST'\r\n  WHEN 'Cardiff'         THEN 'GB-CRF'\r\
    \n  WHEN 'Doncaster'       THEN 'GB-DNC'\r\n  WHEN 'Dundee'          THEN 'GB-DND'\r\
    \n  WHEN 'Durham'          THEN 'GB-DUR'\r\n  WHEN 'Edinburgh'       THEN 'GB-EDH'\r\
    \n  WHEN 'Glasgow'         THEN 'GB-GLG'\r\n  WHEN 'Leeds'           THEN 'GB-LDS'\r\
    \n  WHEN 'Liverpool'       THEN 'GB-LIV'\r\n  WHEN 'Manchester'      THEN 'GB-MAN'\r\
    \n  WHEN 'Newcastle'       THEN 'GB-NET'\r\n  WHEN 'Nottingham'      THEN 'GB-NGM'\r\
    \n  WHEN 'Plymouth'        THEN 'GB-PLY'\r\n  WHEN 'Southampton'     THEN 'GB-STH'\r\
    \n  WHEN 'Exeter'          THEN 'GB-DEV'\r\n  WHEN 'Norwich'         THEN 'GB-NFK'\r\
    \n  WHEN 'Grimsby'         THEN 'GB-NEL'\r\n  WHEN 'Newquay'         THEN 'GB-CON'\r\
    \n  WHEN 'Inverness'       THEN 'GB-HLD'\r\n  WHEN 'Lerwick'         THEN 'GB-ZET'\r\
    \n  WHEN 'Orkney Islands'  THEN 'GB-ORK'\r\n  WHEN 'Stornoway'       THEN 'GB-ELS'\r\
    \n  WHEN 'North Connel'    THEN 'GB-AGB'\r\n  WHEN 'Balemartine'     THEN 'GB-AGB'\r\
    \n  WHEN 'Balivanich'      THEN 'GB-ELS'\r\n  WHEN 'Eoligarry'       THEN 'GB-ELS'\r\
    \n  WHEN 'London'          THEN 'GB-LND'\r\nEND\r\n"
  description: null

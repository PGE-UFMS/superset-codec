# Chart name displayed on the dashboard
slice_name: Calendar Heatmap [Default]
# Visualization type (e.g. big_number_total, echarts_timeseries_bar)
viz_type: cal_heatmap
# Source table/dataset (must exist in datasets/)
datasource_table: tutorial_flights
# Visualization-specific configuration
params:
  viz_type: cal_heatmap
  slice_id: 287
  matrixify_enable: false
  matrixify_mode_columns: disabled
  matrixify_dimension_selection_mode_columns: members
  matrixify_dimension_columns:
    dimension: ''
    values: []
  matrixify_topn_value_columns: 10
  matrixify_all_sort_by_columns: a_to_z
  matrixify_topn_order_columns: true
  matrixify_show_column_headers: true
  matrixify_fit_columns_dynamically: true
  matrixify_mode_rows: disabled
  matrixify_dimension_selection_mode_rows: members
  matrixify_dimension_rows:
    dimension: ''
    values: []
  matrixify_topn_value_rows: 10
  matrixify_all_sort_by_rows: a_to_z
  matrixify_topn_order_rows: true
  matrixify_show_row_labels: true
  matrixify_row_height: 300
  matrixify_charts_per_row: 4
  matrixify_cell_title_template: ''
  granularity_sqla: travel_date
  time_range: '2011-01-01 : 2014-01-01'
  domain_granularity: month
  subdomain_granularity: day
  metrics:
  - aggregate: SUM
    column:
      column_name: cost
      type: FLOAT
    expressionType: SIMPLE
    label: SUM(cost)
    optionName: metric_sum_cost
  adhoc_filters: []
  linear_color_scheme: superset_seq_1
  cell_size: 10
  cell_padding: 2
  cell_radius: 0
  steps: 10
  y_axis_format: SMART_NUMBER
  x_axis_time_format: smart_date
  show_legend: true
  show_values: false
  show_metric_name: true
  extra_form_data: {}
  dashboards:
  - 26

# Title displayed in Superset
dashboard_title: Flow
# Unique identifier used in the URL and embedding
slug: flow
# Visible to all users (false = admins only)
published: true
# Chart list with grid positions (row/col/width/height)
charts:
- slice_name: Sankey Chart [Default]
  row: 0
  col: 0
  width: 6
  height: 50
- slice_name: Chord Diagram [Default]
  row: 0
  col: 1
  width: 6
  height: 50
- slice_name: Graph Chart [Default]
  row: 1
  col: 0
  width: 6
  height: 50
# Native filters applied to the dashboard
native_filters:
- name: Value [Default]
  column: destination_country
  dataset: tutorial_flights
  filter_type: select
  multi_select: true
- name: '[Value] Values are dependent on other filters '
  column: airline
  dataset: tutorial_flights
  filter_type: select
  multi_select: true
- name: Value [Pre-filter available values]
  column: origin_municipality
  dataset: tutorial_flights
  filter_type: select
  multi_select: true
- name: Value [Sort filter values]
  column: origin_name
  dataset: tutorial_flights
  filter_type: select
  multi_select: true
- name: Value [Filter has default value]
  column: origin_country
  dataset: tutorial_flights
  filter_type: select
  multi_select: true
  default_value:
  - United Kingdom
- name: Value [Filter value is required]
  column: origin_country

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    networks: [testnet]
    ports:
      - "${CLICKHOUSE_HOST_PORT:-18123}:8123"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    ulimits:
      nofile: {soft: 262144, hard: 262144}

  postgres:
    image: postgres:17
    networks: [testnet]
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 3s
      timeout: 3s
      retries: 20

  superset-init:
    image: superset-test:6.0.0-dev
    # build:
    #   context: .
    #   dockerfile_inline: |
    #     FROM apache/superset:6.0.0-dev
    #     USER root
    #     RUN pip install --no-cache-dir clickhouse-connect
    #     USER superset
    networks: [testnet]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - bash
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username admin --firstname admin --lastname admin \
          --email admin@example.com --password admin || true
        superset init

  superset:
    image: superset-test:6.0.0-dev
    build:
      context: .
      dockerfile_inline: |
        FROM apache/superset:6.0.0-dev
        USER root
        RUN pip install --no-cache-dir clickhouse-connect
        USER superset
    networks: [testnet]
    depends_on:
      superset-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
    ports:
      - "${SUPERSET_HOST_PORT:-18088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 60

networks:
  testnet:

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "${CLICKHOUSE_HOST_PORT:-18123}:8123"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    ulimits:
      nofile: {soft: 262144, hard: 262144}

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 3s
      timeout: 3s
      retries: 20

  superset:
    image: superset-test:6.0.0-dev
    build:
      context: .
      dockerfile_inline: |
        FROM apache/superset:6.0.0-dev
        USER root
        RUN uv pip install --no-cache-dir clickhouse-connect==0.15.1
        USER superset
    command:
      - bash
      - -c
      - |
        set -e
        SENTINEL="/app/superset_home/.superset-initialized"
        if [[ ! -f "$${SENTINEL}" ]]; then
          echo ":: Superset first run: initializing"
          superset db upgrade
          superset fab create-admin \
            --username admin --firstname Superset --lastname Admin \
            --email admin@example.com --password admin || true
          superset init
          echo ":: Superset initialized. Admin account created."
          echo
          echo ":: Load tutorial_flights table"
          bash /app/load_tutorial_flights.sh
          touch "$${SENTINEL}"
          echo ":: Setup complete"
        fi
        exec superset run -h 0.0.0.0 -p 8088
    depends_on:
      clickhouse: {condition: service_healthy}
    ports:
      - "${SUPERSET_HOST_PORT:-18088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-e2e-only-not-a-real-secret-key}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./load_tutorial_flights.sh:/app/load_tutorial_flights.sh:ro
      - /app/superset_home
      
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 60

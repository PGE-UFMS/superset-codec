[project]
name = "superset-codec"
version = "0.1.0"
description = "Codec for declarative Apache Superset resources — export from UI, apply to any environment."
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.13.4",
    "ruamel.yaml>=0.18",
    "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "clickhouse-connect>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
log_cli = true
log_cli_level = "DEBUG"
markers = [
    "e2e: requer docker compose (aplicado automaticamente a tudo em tests/e2e/)",
]

[project.scripts]
superset-codec = "superset_codec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

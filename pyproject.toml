[project]
name = "superset-provision"
version = "0.1.0"
description = "An idempotent provisioning tool for Apache Superset"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
]

[project.scripts]
superset-provision = "superset_provision.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
